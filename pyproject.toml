[project]
name = "reel-asset-library"
version = "0.1.0"
description = "An MCP server and observability dashboard for a sample media catalog."
requires-python = ">=3.11,<3.15"
dependencies = [
    "anyio>=4.9,<5",
    "httpx>=0.28,<1",
    "mcp==1.30.0",
    "pillow>=11.3,<13",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2,<2",
    "starlette>=0.47,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
